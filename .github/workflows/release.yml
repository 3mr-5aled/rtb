name: RTB Release & CI/CD Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: rtbtui.exe
            asset_name: rtbtui-windows-amd64.exe
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: rtbtui
            asset_name: rtbtui-linux-amd64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: rtbtui
            asset_name: rtbtui-macos-amd64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build TUI Release Binary
        run: cargo build --manifest-path tui/Cargo.toml --release --target ${{ matrix.target }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: tui/target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

  tui-tests:
    name: Run Rust TUI Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run TUI Unit Tests
        run: cargo test --manifest-path tui/Cargo.toml

  core-tests:
    name: Run Core TypeScript CLI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: core/package-lock.json

      - name: Install dependencies & run tests
        run: |
          cd core
          npm ci
          npm run test
          npm run build

  publish-release:
    name: Package and Publish GitHub Release
    needs: [build-and-release, tui-tests, core-tests]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Core CLI Bundle
        shell: pwsh
        run: |
          cd core
          npm ci
          npm run build
          cd ..

      - name: Download Windows Binary Artifact
        uses: actions/download-artifact@v4
        with:
          name: rtbtui-windows-amd64.exe
          path: release-assets/windows

      - name: Download Linux Binary Artifact
        uses: actions/download-artifact@v4
        with:
          name: rtbtui-linux-amd64
          path: release-assets/linux

      - name: Download macOS Binary Artifact
        uses: actions/download-artifact@v4
        with:
          name: rtbtui-macos-amd64
          path: release-assets/macos

      - name: Assemble Release Bundle (rtb-cli.zip & rtb-cli.js)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging -Force | Out-Null
          Copy-Item -Path "core\dist\index.js" -Destination "staging\rtb.js" -Force
          Copy-Item -Path "core\dist\index.js" -Destination "rtb-cli.js" -Force
          Copy-Item -Path "release-assets\windows\rtbtui.exe" -Destination "staging\rtbtui.exe" -Force
          if (Test-Path "logo.txt") {
            Copy-Item -Path "logo.txt" -Destination "staging\logo.txt" -Force
          }
          if (Test-Path "uninstall.ps1") {
            Copy-Item -Path "uninstall.ps1" -Destination "staging\uninstall.ps1" -Force
          }
          if (Test-Path "VERSION") {
            Copy-Item -Path "VERSION" -Destination "staging\VERSION" -Force
          }
          Compress-Archive -Path "staging\*" -DestinationPath "rtb-cli.zip" -Force

          # Move standalone binaries for release attachment
          Move-Item -Path "release-assets\windows\rtbtui.exe" -Destination "rtbtui-windows-amd64.exe" -Force
          Move-Item -Path "release-assets\linux\rtbtui" -Destination "rtbtui-linux-amd64" -Force
          Move-Item -Path "release-assets\macos\rtbtui" -Destination "rtbtui-macos-amd64" -Force

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rtb-cli.zip
            rtb-cli.js
            rtbtui-windows-amd64.exe
            rtbtui-linux-amd64
            rtbtui-macos-amd64
          generate_release_notes: true

  publish-npm:
    name: Publish Package to npm
    needs: [core-tests]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Build & Publish to npm
        run: |
          cd core
          npm ci
          npm run build
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
