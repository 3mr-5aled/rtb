name: RTB Release & CI/CD Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: rtb.exe
            asset_name: rtb-windows-amd64.exe
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: rtb
            asset_name: rtb-linux-amd64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: rtb
            asset_name: rtb-macos-amd64
          - target: aarch64-apple-darwin
            os: macos-14
            artifact_name: rtb
            asset_name: rtb-macos-arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build TUI Release Binary
        run: cargo build --manifest-path tui/Cargo.toml --release --target ${{ matrix.target }}

      - name: Binary Smoke Test
        shell: bash
        run: ./tui/target/${{ matrix.target }}/release/${{ matrix.artifact_name }} --version

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: tui/target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

  cargo-tests:
    name: Run Rust Cargo Tests (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Execute Cargo Tests
        run: cargo test --manifest-path tui/Cargo.toml --target ${{ matrix.target }}

  pester-tests:
    name: Run PowerShell CLI Tests
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Pester v5
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.0.0 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Execute Pester Unit Tests
        shell: pwsh
        run: |
          $env:RTB_NON_INTERACTIVE = 'true'
          Import-Module Pester -MinimumVersion 5.0.0
          Import-Module './cli/rtb.psd1' -Force
          Invoke-Pester ./cli/tests/ -Passthru

  publish-release:
    name: Package and Publish GitHub Release
    needs: [build-and-release, pester-tests, cargo-tests]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Binary Artifact
        uses: actions/download-artifact@v4
        with:
          name: rtb-windows-amd64.exe
          path: release-assets/windows

      - name: Download Linux Binary Artifact
        uses: actions/download-artifact@v4
        with:
          name: rtb-linux-amd64
          path: release-assets/linux

      - name: Download macOS Binary Artifact
        uses: actions/download-artifact@v4
        with:
          name: rtb-macos-amd64
          path: release-assets/macos

      - name: Download macOS ARM64 Binary Artifact
        uses: actions/download-artifact@v4
        with:
          name: rtb-macos-arm64
          path: release-assets/macos-arm64

      - name: Assemble Release Bundle and Checksums
        shell: pwsh
        run: |
          # Move standalone binaries for release attachment
          Move-Item -Path "release-assets\windows\rtb.exe" -Destination "rtb-windows-amd64.exe" -Force
          Move-Item -Path "release-assets\linux\rtb" -Destination "rtb-linux-amd64" -Force
          Move-Item -Path "release-assets\macos\rtb" -Destination "rtb-macos-amd64" -Force
          Move-Item -Path "release-assets\macos-arm64\rtb" -Destination "rtb-macos-arm64" -Force

          # Generate SHA256 sidecars for all standalone binaries
          $binaries = @("rtb-windows-amd64.exe", "rtb-linux-amd64", "rtb-macos-amd64", "rtb-macos-arm64")
          foreach ($bin in $binaries) {
            $hash = (Get-FileHash -Path $bin -Algorithm SHA256).Hash.ToLower()
            "$hash  $bin" | Out-File -FilePath "$bin.sha256" -Encoding ascii
          }

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rtb-windows-amd64.exe
            rtb-windows-amd64.exe.sha256
            rtb-linux-amd64
            rtb-linux-amd64.sha256
            rtb-macos-amd64
            rtb-macos-amd64.sha256
            rtb-macos-arm64
            rtb-macos-arm64.sha256
          generate_release_notes: true
