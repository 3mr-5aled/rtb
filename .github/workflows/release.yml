name: RTB Release & CI/CD Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: rtbtui.exe
            asset_name: rtbtui-windows-amd64.exe
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: rtbtui
            asset_name: rtbtui-linux-amd64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: rtbtui
            asset_name: rtbtui-macos-amd64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build TUI Release Binary
        run: cargo build --manifest-path tui/Cargo.toml --release --target ${{ matrix.target }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: tui/target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

  pester-tests:
    name: Run PowerShell CLI Tests
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup RTB Test Configuration
        shell: pwsh
        run: |
          $configDir = Join-Path $env:USERPROFILE '.config\rtb'
          if (-not (Test-Path $configDir)) {
            New-Item -ItemType Directory -Path $configDir -Force | Out-Null
          }
          $testActive = Join-Path ([System.IO.Path]::GetTempPath()) 'rtb-ci-active'
          $testPaused = Join-Path ([System.IO.Path]::GetTempPath()) 'rtb-ci-paused'
          New-Item -ItemType Directory -Path $testActive -Force | Out-Null
          New-Item -ItemType Directory -Path $testPaused -Force | Out-Null
          @{
            version = "1.0.0"
            projectRoots = @{
              active = @{ path = $testActive; label = "Active"; emoji = "📁" }
              paused = @{ path = $testPaused; label = "Paused"; emoji = "⏸️" }
            }
            backupRoot = [System.IO.Path]::GetTempPath()
            cleanDeps = @{ targets = @("node_modules") }
          } | ConvertTo-Json -Depth 5 | Set-Content -Path (Join-Path $configDir 'rtb.config.json') -Encoding UTF8

      - name: Execute Pester Unit Tests
        shell: pwsh
        run: |
          $env:RTB_NON_INTERACTIVE = 'true'
          Import-Module './cli/rtb.psd1' -Force
          Invoke-Pester ./cli/tests/ -Passthru

  core-tests:
    name: Run Core TypeScript CLI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: core/package-lock.json

      - name: Install dependencies & run tests
        run: |
          cd core
          npm ci
          npm run test
          npm run build

  publish-release:
    name: Package and Publish GitHub Release
    needs: [build-and-release, pester-tests, core-tests]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Core CLI Bundle
        shell: pwsh
        run: |
          cd core
          npm ci
          npm run build
          cd ..

      - name: Download Windows Binary Artifact
        uses: actions/download-artifact@v4
        with:
          name: rtbtui-windows-amd64.exe
          path: release-assets/windows

      - name: Download Linux Binary Artifact
        uses: actions/download-artifact@v4
        with:
          name: rtbtui-linux-amd64
          path: release-assets/linux

      - name: Download macOS Binary Artifact
        uses: actions/download-artifact@v4
        with:
          name: rtbtui-macos-amd64
          path: release-assets/macos

      - name: Assemble Release Bundle (rtb-cli.zip & rtb-cli.js)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging -Force | Out-Null
          Copy-Item -Path "cli" -Destination "staging\cli" -Recurse -Force
          Copy-Item -Path "core\dist\index.js" -Destination "staging\rtb.js" -Force
          Copy-Item -Path "core\dist\index.js" -Destination "rtb-cli.js" -Force
          Copy-Item -Path "release-assets\windows\rtbtui.exe" -Destination "staging\rtbtui.exe" -Force
          if (Test-Path "logo.txt") {
            Copy-Item -Path "logo.txt" -Destination "staging\logo.txt" -Force
          }
          if (Test-Path "uninstall.ps1") {
            Copy-Item -Path "uninstall.ps1" -Destination "staging\uninstall.ps1" -Force
          }
          Compress-Archive -Path "staging\*" -DestinationPath "rtb-cli.zip" -Force

          # Move standalone binaries for release attachment
          Move-Item -Path "release-assets\windows\rtbtui.exe" -Destination "rtbtui-windows-amd64.exe" -Force
          Move-Item -Path "release-assets\linux\rtbtui" -Destination "rtbtui-linux-amd64" -Force
          Move-Item -Path "release-assets\macos\rtbtui" -Destination "rtbtui-macos-amd64" -Force

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rtb-cli.zip
            rtb-cli.js
            rtbtui-windows-amd64.exe
            rtbtui-linux-amd64
            rtbtui-macos-amd64
          generate_release_notes: true
