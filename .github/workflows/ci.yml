name: RTB Continuous Integration

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:

jobs:
  pester-tests:
    name: Run PowerShell CLI Tests
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build RTB Binary
        run: cargo build --release --manifest-path tui/Cargo.toml

      - name: Execute Pester Unit Tests
        shell: pwsh
        run: |
          $env:RTB_NON_INTERACTIVE = 'true'
          Import-Module './cli/rtb.psd1' -Force
          Invoke-Pester ./cli/tests/ -Passthru

  cargo-tests:
    name: Run Rust Cargo Tests (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Execute Cargo Tests
        run: cargo test --manifest-path tui/Cargo.toml --target ${{ matrix.target }}
